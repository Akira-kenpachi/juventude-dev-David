<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="#" method="post">
        <input type="text" name="nome" placeholder="Seu nome" class="input-alter">
        <br>
        <input type="email" name="email" placeholder="Seu@email.com" class="input-alter">
        <br>
        <input type="password" name="senha" placeholder="Sua senha" class="input-alter">
        <br>
        <input type="number" name="idade" placeholder="Sua idade" class="input-alter">
        <br>
        <input type="data" name="nascimento" placeholder="data de nascimento" class="input-alter">
        <br>
        <input type="checkbox" name="aceite" value="sim"> Aceito os termos
        <br>
        <input type="radio" name="genero" value="m"> Masculino
        <br>
        <input type="radio" name="genero" value="f"> Feminino
        <br>
        <input type="radio" name="genero" value="outro"> Outro
        <br>
        <input type="file" name="foto_perfil" class="input-alter">
        <br>
        <select name="assunto">
            <option value="duvida">Dúvida</option>
            <option value="elogio">Elogio</option>
            <option value="reclamacao">Reclamação</option>
        </select>
        <br>
        <textarea name="mensagem" rows="5" placeholder="Escreva sua mensagem"></textarea>
        <br>
        <button type="submit">Enviar</button>
        <br>
        <label for="campo-nome" name="nome">Nome completo</label>
        <input type="text" id="campo-nome" name="nome">
        <br>
        <label for="campo-aceite">Aceito os termos de uso</label>
        <input type="checkbox" id="campo-aceite" name="aceite">
    </form>
</body>

</html>
